<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MilkySpace WASM Test</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        canvas {
            border: 1px solid #444;
            margin: 20px;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }
        #debug {
            background-color: rgba(0, 0, 0, 0.7);
            border: 1px solid #333;
            padding: 10px;
            margin: 10px;
            width: 80%;
            max-width: 800px;
            font-family: monospace;
            white-space: pre;
            overflow: auto;
            max-height: 200px;
        }
        h1 {
            color: #0f0;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
        }
        button {
            background-color: #0f0;
            color: #000;
            border: none;
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background-color: #0c0;
        }
    </style>
</head>
<body>
    <h1>MilkySpace WASM Test</h1>
    <div>
        <canvas id="canvas" width="800" height="600"></canvas>
    </div>
    <div>
        <button id="debugBtn">Print Debug Info</button>
        <button id="resetBtn">Reset Game</button>
    </div>
    <div id="debug">Debug output will appear here...</div>

    <script>
        // Debug log function
        const debugElement = document.getElementById('debug');
        function log(message) {
            console.log(message);
            debugElement.textContent += message + '\n';
            // Limit log size
            if (debugElement.textContent.split('\n').length > 50) {
                const lines = debugElement.textContent.split('\n');
                debugElement.textContent = lines.slice(lines.length - 50).join('\n');
            }
            // Auto-scroll to bottom
            debugElement.scrollTop = debugElement.scrollHeight;
        }

        // Create module configuration
        var Module = {
            canvas: document.getElementById('canvas'),
            print: function(text) { 
                log("[WASM] " + text);
            },
            printErr: function(text) {
                log("[WASM ERROR] " + text);
            },
            onRuntimeInitialized: function() {
                log("WASM runtime initialized successfully!");
                
                // Set up event handlers after initialization
                document.addEventListener('keydown', function(event) {
                    try {
                        if (typeof Module._handle_key_down === 'function') {
                            Module._handle_key_down(event.keyCode);
                        }
                    } catch (e) {
                        log("Error in keydown handler: " + e);
                    }
                });
                
                document.addEventListener('keyup', function(event) {
                    try {
                        if (typeof Module._handle_key_up === 'function') {
                            Module._handle_key_up(event.keyCode);
                        }
                    } catch (e) {
                        log("Error in keyup handler: " + e);
                    }
                });
                
                // Set up reset button
                document.getElementById('resetBtn').addEventListener('click', function() {
                    try {
                        if (typeof Module._reset_game === 'function') {
                            Module._reset_game();
                            log("Game reset");
                        } else {
                            log("Reset function not available");
                        }
                    } catch (e) {
                        log("Error resetting game: " + e);
                    }
                });
                
                // Set up debug button
                document.getElementById('debugBtn').addEventListener('click', function() {
                    log("--- Debug Information ---");
                    
                    // List available functions
                    log("Module functions:");
                    for (const key in Module) {
                        if (typeof Module[key] === 'function' && !key.startsWith('_')) {
                            log("  " + key);
                        }
                    }
                    
                    log("Exported WASM functions:");
                    for (const key in Module) {
                        if (typeof Module[key] === 'function' && key.startsWith('_')) {
                            log("  " + key);
                        }
                    }
                    
                    // Try to get game state
                    try {
                        if (typeof Module._get_score === 'function') {
                            const score = Module._get_score();
                            log("Score: " + score);
                        }
                        
                        if (typeof Module._get_level === 'function') {
                            const level = Module._get_level();
                            log("Level: " + level);
                        }
                        
                        if (typeof Module._get_health === 'function') {
                            const health = Module._get_health();
                            log("Health: " + health);
                        }
                        
                        if (typeof Module._is_game_over === 'function') {
                            const gameOver = Module._is_game_over();
                            log("Game Over: " + (gameOver ? "Yes" : "No"));
                        }
                    } catch (e) {
                        log("Error getting game state: " + e);
                    }
                });
            }
        };
    </script>

    <!-- Load the WebAssembly module -->
    <script src="build/MilkySpace.js"></script>
    <script>
        log("Loading MilkySpace module...");
        
        window.onerror = function(message, source, lineno, colno, error) {
            log("ERROR: " + message);
            if (error && error.stack) {
                log("Stack: " + error.stack);
            }
            return true;
        };
    </script>
</body>
</html>
